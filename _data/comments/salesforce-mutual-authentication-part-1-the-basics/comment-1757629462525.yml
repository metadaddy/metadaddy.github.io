message: >-
  Hi Desain - with regular one-way TLS/SSL, only the server has a certificate,
  so the client has some assurance of the identity of the server, but the server
  has no idea who the client is. With mutual authentication, the client also has
  a certificate that is uses during the TLS/SSL handshake, so the server also
  knows who the client is, or at least, that the client has possession of the
  private key corresponding to the certificate.
